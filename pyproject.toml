[project]
name = "url-fixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lincosin", email = "willynugraha129@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confusable-homoglyphs>=3.3.1",
    "idna>=3.18",
    "typer>=0.26.7",
]

[project.scripts]
url-fixer = "url_fixer:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
